<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com/"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Profile Page</title>
  </head>

  <body class="w-screen bg-gray-100 flex flex-row-reverse">
    <main
      class=" flex-1 bg-white  relative shadow-lg md:pb-0 "
    >
      <div class="relative h-52 w-full">
        <img
          src="full-shot-adventurous-couple-bivouacking.jpg" alt="image"
          class="w-full h-full object-cover  "
        />

        <!-- Edit cover -->
        <button class="absolute top-3 right-3 bg-white/80 p-2 rounded-full">
          <i class="fa-solid fa-camera"></i>
        </button>
      </div>

      <!-- Profile image -->
      <div class="absolute top-36 left-6">
        <div class="relative">
          <img
            src="full-shot-adventurous-man-bivouacking.jpg" alt="image"
            class="w-24 h-24 rounded-full border-4 border-white object-cover bg-white"
          />
          <button
            class="absolute bottom-0 right-0 bg-green-500 text-white w-7 h-7 rounded-full text-xs flex items-center justify-center"
          >
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div class="px-6 mt-20 pb-24">
        <!-- Title -->
        <h2 class="text-lg font-semibold mb-1">Edit Profile</h2>
        <p class="text-sm text-gray-500 mb-6">
          Update your personal information
        </p>

        <!-- Form -->
        <form class="space-y-4">
          <div>
            <label class="text-xs font-medium text-gray-600">First name</label>
            <input
              type="text"
              class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <div>
            <label class="text-xs font-medium text-gray-600">Last name</label>
            <input
              type="text"
              class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <div>
            <label class="text-xs font-medium text-gray-600">Email</label>
            <input
              type="email"
              class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <div>
            <label class="text-xs font-medium text-gray-600"
              >Phone number</label
            >
            <input
              type="tel"
              class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>
          <div>
            <h2 class="font-medium mx-4"> Favorit</h2>
          </div>
           <div class="  bg-white rounded-2xl  overflow-hidden  h-70 w-full  ">
            <a href="index3.html">
                <img src="horizontal-shot-group-people-hiking-mountains-covered-snow-cloudy-sky.jpg" alt="" class=" w-full h-50 object-cover ">
            </a>
            <div class=" flex justify-between">
                <div>
                    <h2>Yellow River</h2>
                    <p>by lan jacobson</p>
                </div>
                <div class="flex gap-4">
                    <p class="text-gray-600"> <i class="fa-solid fa-location-crosshairs text-gray-600"></i> location</p>
                    <p class="text-gray-600"><i class="fa-regular fa-clock text-gray-600"></i> time</p>
                    <p class="text-gray-600"> <i class="fa-solid fa-eye text-gray-600"></i> views </p>
                </div>
            </div>
        </div>

          <!-- Save button -->
          <button
            class="w-full bg-green-500 text-white py-3 rounded-xl font-semibold hover:bg-green-600 transition"
          >
            Save changes
          </button>
        </form>
      </div>
    </main>

       
            <nav class="fixed bottom-0 w-full bg-white shadow-md py-2 flex justify-around
         md:static md:w-1/6 md:h-screen md:flex-col md:items-center md:justify-between md:gap-6">
                <div class="flex items-center justify-center bg-green-600 rounded-xl w-10 text-center "> <i
                        class="fa-solid fa-house text-xl cursor-pointer "></i>
                </div>
                <div class="flex items-center justify-center bg-white rounded-xl w-10 text-center hover:bg-green-300 "> 
                    <i class="fa-regular fa-heart text-xl cursor-pointer flex items-center justify-center"></i>
                </div>
                <div class="flex items-center justify-center bg-white rounded-xl w-10 text-center hover:bg-green-300">
                    <i class="fa-solid fa-location-dot text-xl cursor-pointer"></i>
                </div>
                <div class="flex items-center justify-center bg-white rounded-xl w-10 text-center hover:bg-green-300">
                      <i class="fa-regular fa-user text-xl cursor-pointer"></i>
                  
                </div>
            </nav>

   
  </body>
</html>
